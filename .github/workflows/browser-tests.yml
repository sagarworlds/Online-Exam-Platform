name: Browser tests

# NFR-8, D19: the same journeys on each browser engine, each its own job so a failure names the engine. The API is stubbed in the
# browser, so this needs no database. WebKit is the engine Safari is built on, not Safari.
#
# Called by ci.yml (a pull request: Chromium) and by ci-extended.yml (main, nightly, on demand: all three engines), so the steps are
# written once. `scripts/verify.sh browsers` runs the same steps on a developer's machine.
on:
  workflow_call:
    inputs:
      browsers:
        description: 'The engines to run, as a JSON array: ["chromium"] or ["chromium","firefox","webkit"].'
        required: true
        type: string

permissions:
  contents: read

jobs:
  browser-tests-web:
    name: Browser tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(inputs.browsers) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/web

      # The fake API's types come from the app's own DTOs, so a DTO change it no longer matches fails here, not silently.
      - name: Type-check the browser tests
        run: npm run e2e:typecheck
        working-directory: apps/web

      - name: Build
        run: npm run build
        working-directory: apps/web

      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}
        working-directory: apps/web

      - name: Run the browser tests
        run: npm run e2e -- --project=${{ matrix.browser }}
        working-directory: apps/web

      - name: Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.browser }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
