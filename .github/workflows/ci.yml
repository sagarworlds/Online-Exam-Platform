name: CI

# A branch is tested once, by its pull request. Pushes are for main only: a push trigger on the working branches as well ran the whole
# suite twice on the same commit for every pull request.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same pull request replaces the run still going. Runs on main are never cancelled, so each merge keeps its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Every job has a timeout: a normal run takes 1 to 8 minutes, and a browser job that hung ran 22 to 26 minutes before it failed.
jobs:
  build-test-api:
    name: Build & test API (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ExamPlatform.slnx
        working-directory: apps/api

      # NFR-5: fails on any known-vulnerable NuGet package. It reads the findings itself, because the SDK exits 0 even when it
      # reports one (scripts/security/check-nuget-vulnerabilities.sh).
      - name: Dependency vulnerability scan (NuGet)
        run: ../../scripts/security/check-nuget-vulnerabilities.sh ExamPlatform.slnx
        working-directory: apps/api

      # NFR-5: the .NET security analyzers are errors in apps/api/.editorconfig, so a security finding fails this step.
      - name: Build
        run: dotnet build ExamPlatform.slnx --no-restore -c Release
        working-directory: apps/api

      # Integration tests use Testcontainers (Npgsql), which needs the Docker
      # daemon already running on the runner — true by default on GitHub-hosted
      # ubuntu-latest, so no extra services: block is needed here.
      - name: Test
        run: >
          dotnet test ExamPlatform.slnx --no-build -c Release
          --collect:"XPlat Code Coverage" --results-directory ./coverage
        working-directory: apps/api

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage
          retention-days: 7

  lint-build-test-web:
    name: Lint, build & test web (Angular)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/web

      # NFR-5: npm exits non-zero for a high or critical advisory in the dependency tree (moderate and low do not fail the step).
      - name: Dependency audit (npm, high and critical)
        run: npm audit --audit-level=high
        working-directory: apps/web

      - name: Lint
        run: npm run lint
        working-directory: apps/web

      - name: Build
        run: npm run build
        working-directory: apps/web

      - name: Test
        run: npm test -- --watch=false
        working-directory: apps/web

  # NFR-8, D19: Chromium on every pull request. Firefox, WebKit and the run against the real API are in ci-extended.yml (main, nightly,
  # on demand), and `scripts/verify.sh` runs all of them on a developer's machine.
  browser-tests:
    uses: ./.github/workflows/browser-tests.yml
    with:
      browsers: '["chromium"]'
