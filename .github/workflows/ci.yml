name: CI

on:
  push:
    branches: [main, "sp/**", "SP/**"]
  pull_request:
    branches: [main]

jobs:
  build-test-api:
    name: Build & test API (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ExamPlatform.slnx
        working-directory: apps/api

      # NFR-5: fails on any known-vulnerable NuGet package. It reads the findings itself, because the SDK exits 0 even when it
      # reports one (scripts/security/check-nuget-vulnerabilities.sh).
      - name: Dependency vulnerability scan (NuGet)
        run: ../../scripts/security/check-nuget-vulnerabilities.sh ExamPlatform.slnx
        working-directory: apps/api

      # NFR-5: the .NET security analyzers are errors in apps/api/.editorconfig, so a security finding fails this step.
      - name: Build
        run: dotnet build ExamPlatform.slnx --no-restore -c Release
        working-directory: apps/api

      # Integration tests use Testcontainers (Npgsql), which needs the Docker
      # daemon already running on the runner — true by default on GitHub-hosted
      # ubuntu-latest, so no extra services: block is needed here.
      - name: Test
        run: >
          dotnet test ExamPlatform.slnx --no-build -c Release
          --collect:"XPlat Code Coverage" --results-directory ./coverage
        working-directory: apps/api

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage
          retention-days: 7

  lint-build-test-web:
    name: Lint, build & test web (Angular)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/web

      # NFR-5: npm exits non-zero for a high or critical advisory in the dependency tree (moderate and low do not fail the step).
      - name: Dependency audit (npm, high and critical)
        run: npm audit --audit-level=high
        working-directory: apps/web

      - name: Lint
        run: npm run lint
        working-directory: apps/web

      - name: Build
        run: npm run build
        working-directory: apps/web

      - name: Test
        run: npm test -- --watch=false
        working-directory: apps/web

  # NFR-8, D19: the same journeys on each browser engine, each its own job so a failure names the engine. The API is stubbed in the
  # browser, so this needs no database. WebKit is the engine Safari is built on, not Safari.
  browser-tests-web:
    name: Browser tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/web

      # The fake API's types come from the app's own DTOs, so a DTO change it no longer matches fails here, not silently.
      - name: Type-check the browser tests
        run: npm run e2e:typecheck
        working-directory: apps/web

      - name: Build
        run: npm run build
        working-directory: apps/web

      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}
        working-directory: apps/web

      - name: Run the browser tests
        run: npm run e2e -- --project=${{ matrix.browser }}
        working-directory: apps/web

      - name: Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.browser }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  # NFR-8, D19: the candidate journey on each browser engine against the real API and a real Postgres. The jobs above stub the API in the
  # browser and so show that each engine runs the screens; this one shows that the page and the API agree. The API starts the way a
  # developer runs it (Development: it migrates its own database, and writes sign-in codes to its log, which the tests read), against the
  # database below, whose name and login are the ones the Development settings already name.
  browser-tests-real-api:
    name: Browser tests against the real API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: examplatform
          POSTGRES_PASSWORD: examplatform
          POSTGRES_DB: examplatform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U examplatform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Build the API
        run: dotnet build src/Host/ExamPlatform.Api -c Release
        working-directory: apps/api

      - name: Install dependencies
        run: npm ci
        working-directory: apps/web

      - name: Build the web app
        run: npm run build
        working-directory: apps/web

      - name: Install the browsers
        run: npx playwright install --with-deps chromium firefox webkit
        working-directory: apps/web

      - name: Run the browser tests
        run: npm run e2e:fullstack
        working-directory: apps/web

      # The API's log holds the sign-in codes of the test accounts only. It is a hidden folder, which the upload skips unless told not to.
      - name: Upload the report, traces and API log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-real-api
          include-hidden-files: true
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/web/e2e/.run/api.log
          retention-days: 7
