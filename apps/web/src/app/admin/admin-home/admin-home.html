<div class="page page--wide">
  <div class="page-header">
    <h1>{{ 'admin.title' | t }}</h1>
  </div>

  @if (groups().length === 0) {
    <p class="hint">{{ 'admin.noAreas' | t }}</p>
  } @else {
    @for (group of groups(); track $index) {
      <div class="admin-group">
        @if (group.heading; as heading) {
          <h2 class="admin-group__heading">{{ heading | t }}</h2>
        }
        <app-admin-area-list [sections]="group.sections" />
      </div>
    }
  }
</div>
