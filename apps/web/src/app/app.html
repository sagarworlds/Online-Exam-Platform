<header class="nav">
  <a class="brand" routerLink="/">Online Exam Platform</a>
  <nav>
    @if (authSession.isAuthenticated()) {
      <a routerLink="/profile">Profile</a>
      <a routerLink="/consent">Consent</a>
      <button type="button" (click)="logout()">Log out</button>
    } @else {
      <a routerLink="/login">Log in</a>
      <a routerLink="/register">Register</a>
    }
  </nav>
</header>

<router-outlet />

<footer class="health-widget">
  @switch (health().state) {
    @case ('checking') {
      <span class="status status--checking">Checking API…</span>
    }
    @case ('healthy') {
      <span class="status status--healthy">API is healthy.</span>
    }
    @case ('unhealthy') {
      <span class="status status--unhealthy">API is unreachable: {{ health().reason }}</span>
    }
  }
</footer>
