<main class="landing">
  <h1>Online Exam Platform</h1>
  <p class="subtitle">Angular 22 web app — proving the API is reachable before anything else is built.</p>

  @switch (health().state) {
    @case ('checking') {
      <p class="status status--checking">Checking API health…</p>
    }
    @case ('healthy') {
      <p class="status status--healthy">API is healthy.</p>
    }
    @case ('unhealthy') {
      <p class="status status--unhealthy">API is unreachable: {{ health().reason }}</p>
    }
  }

</main>
