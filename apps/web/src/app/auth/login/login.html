<div class="page">
  <h1>Log in</h1>

  <div class="mode-toggle">
    <button type="button" [class.active]="mode() === 'password'" (click)="setMode('password')">Password</button>
    <button type="button" [class.active]="mode() === 'otp'" (click)="setMode('otp')">One-time code</button>
  </div>

  @if (errorMessage()) {
    <p class="error-message">{{ errorMessage() }}</p>
  }

  @if (mode() === 'password') {
    <form class="card" [formGroup]="passwordForm" (ngSubmit)="submitPassword()">
      <div class="field">
        <label for="login-email">Email</label>
        <input id="login-email" type="email" formControlName="email" autocomplete="email" />
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input id="login-password" type="password" formControlName="password" autocomplete="current-password" />
      </div>
      <button type="submit" class="primary" [disabled]="passwordForm.invalid || submitting()">Log in</button>
    </form>
  } @else {
    <form class="card" [formGroup]="otpForm" (ngSubmit)="submitOtpRequest()">
      <div class="field">
        <label for="login-otp-destination">Email or phone number</label>
        <input id="login-otp-destination" type="text" formControlName="destination" autocomplete="username" />
      </div>
      <button type="submit" class="primary" [disabled]="otpForm.invalid || submitting()">Send code</button>
    </form>
  }

  <p class="link-row">
    <a routerLink="/register" [queryParams]="registerQueryParams">Create an account</a>
    <a routerLink="/password-reset/request">Forgot password?</a>
  </p>
</div>
