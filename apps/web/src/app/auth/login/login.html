<div class="page">
  <h1>{{ 'login.title' | t }}</h1>

  @if (sessionEndedMessage) {
    <p class="info-message" role="status">{{ sessionEndedMessage }}</p>
  }

  <div class="mode-toggle">
    <button type="button" [class.active]="mode() === 'password'" (click)="setMode('password')">{{ 'login.mode.password' | t }}</button>
    <button type="button" [class.active]="mode() === 'otp'" (click)="setMode('otp')">{{ 'login.mode.otp' | t }}</button>
  </div>

  @if (errorMessage()) {
    <p class="error-message">{{ errorMessage() }}</p>
  }

  @if (mode() === 'password') {
    <form class="card" [formGroup]="passwordForm" (ngSubmit)="submitPassword()">
      <div class="field">
        <label for="login-email">{{ 'login.email' | t }}</label>
        <input id="login-email" type="email" formControlName="email" autocomplete="email" />
      </div>
      <div class="field">
        <label for="login-password">{{ 'login.password' | t }}</label>
        <input id="login-password" type="password" formControlName="password" autocomplete="current-password" />
      </div>
      <button type="submit" class="primary" [disabled]="passwordForm.invalid || submitting()">{{ 'login.submit' | t }}</button>
    </form>
  } @else {
    <form class="card" [formGroup]="otpForm" (ngSubmit)="submitOtpRequest()">
      <div class="field">
        <label for="login-otp-destination">{{ 'login.destination' | t }}</label>
        <input
          id="login-otp-destination"
          type="text"
          formControlName="destination"
          autocomplete="username"
          aria-describedby="login-otp-staff-hint"
        />
        <p id="login-otp-staff-hint" class="field-hint">
          {{ 'login.staffHint' | t }}
        </p>
      </div>
      <button type="submit" class="primary" [disabled]="otpForm.invalid || submitting()">{{ 'login.sendCode' | t }}</button>
    </form>
  }

  <p class="link-row">
    <a routerLink="/register" [queryParams]="registerQueryParams">{{ 'login.createAccount' | t }}</a>
    <a routerLink="/password-reset/request">{{ 'login.forgot' | t }}</a>
  </p>
</div>
