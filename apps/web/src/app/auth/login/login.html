<div class="page">
  <h1>Log in</h1>

  @if (sessionEndedMessage) {
    <p class="info-message" role="status">{{ sessionEndedMessage }}</p>
  }

  <div class="mode-toggle">
    <button type="button" [class.active]="mode() === 'password'" (click)="setMode('password')">Password</button>
    <button type="button" [class.active]="mode() === 'otp'" (click)="setMode('otp')">One-time code</button>
  </div>

  @if (errorMessage()) {
    <p class="error-message">{{ errorMessage() }}</p>
  }

  @if (mode() === 'password') {
    <form [formGroup]="passwordForm" (ngSubmit)="submitPassword()">
      <div class="field">
        <label for="login-email">Email</label>
        <input id="login-email" type="email" formControlName="email" autocomplete="email" />
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input id="login-password" type="password" formControlName="password" autocomplete="current-password" />
      </div>
      <button type="submit" class="primary" [disabled]="passwordForm.invalid || submitting()">Log in</button>
    </form>
  } @else {
    <form [formGroup]="otpForm" (ngSubmit)="submitOtpRequest()">
      <div class="field">
        <label for="login-otp-destination">Email or phone number</label>
        <input
          id="login-otp-destination"
          type="text"
          formControlName="destination"
          autocomplete="username"
          aria-describedby="login-otp-staff-hint"
        />
        <p id="login-otp-staff-hint" class="field-hint">
          Staff and admin accounts sign in with a password and a one-time code.
        </p>
      </div>
      <button type="submit" class="primary" [disabled]="otpForm.invalid || submitting()">Send code</button>
    </form>
  }

  <p class="link-row">
    <a routerLink="/register">Create an account</a>
    <a routerLink="/password-reset/request">Forgot password?</a>
  </p>
</div>
