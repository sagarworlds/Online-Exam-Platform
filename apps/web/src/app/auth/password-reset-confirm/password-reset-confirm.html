<div class="page">
  <h1>Set a new password</h1>

  @if (submitted()) {
    <p class="success-message">Password updated. You can now log in.</p>
  } @else {
    @if (errorMessage()) {
      <p class="error-message">{{ errorMessage() }}</p>
    }

    <form class="card" [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label for="reset-confirm-code">Reset code</label>
        <input id="reset-confirm-code" type="text" formControlName="resetCode" placeholder="<id>:<token>" />
      </div>
      <div class="field">
        <label for="reset-confirm-password">New password</label>
        <input
          id="reset-confirm-password"
          type="password"
          formControlName="newPassword"
          autocomplete="new-password"
        />
      </div>
      <button type="submit" class="primary" [disabled]="form.invalid || submitting()">Update password</button>
    </form>
  }

  <p class="link-row">
    <a routerLink="/login">Back to login</a>
  </p>
</div>
