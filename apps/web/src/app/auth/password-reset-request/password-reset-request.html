<div class="page">
  <h1>Reset password</h1>

  @if (submitted()) {
    <p class="success-message">If an account exists for that email, a reset code has been sent.</p>
  } @else {
    @if (errorMessage()) {
      <p class="error-message">{{ errorMessage() }}</p>
    }

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label for="reset-request-email">Email</label>
        <input id="reset-request-email" type="email" formControlName="email" autocomplete="email" />
      </div>
      <button type="submit" class="primary" [disabled]="form.invalid || submitting()">Send reset code</button>
    </form>
  }

  <p class="link-row">
    <a routerLink="/password-reset/confirm">I already have a reset code</a>
    <a routerLink="/login">Back to login</a>
  </p>
</div>
