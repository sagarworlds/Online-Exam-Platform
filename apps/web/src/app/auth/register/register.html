<div class="page">
  <h1>{{ 'register.title' | t }}</h1>

  @if (errorMessage()) {
    <p class="error-message">{{ errorMessage() }}</p>
  }

  <form class="card" [formGroup]="form" (ngSubmit)="submit()">
    <div class="field">
      <label for="register-display-name">{{ 'register.displayName' | t }}</label>
      <input
        id="register-display-name"
        type="text"
        formControlName="displayName"
        autocomplete="name"
        [attr.aria-invalid]="displayNameError() ? 'true' : null"
        [attr.aria-describedby]="displayNameError() ? 'register-display-name-error' : null"
      />
      @if (displayNameError(); as message) {
        <p id="register-display-name-error" class="field-error">{{ message }}</p>
      }
    </div>

    <div class="field">
      <label for="register-dob">{{ 'register.dob' | t }}</label>
      <input
        id="register-dob"
        type="date"
        formControlName="dateOfBirth"
        autocomplete="bday"
        [max]="maxDateOfBirth"
        [attr.aria-invalid]="dateOfBirthError() ? 'true' : null"
        [attr.aria-describedby]="dateOfBirthError() ? 'register-dob-error' : null"
      />
      @if (dateOfBirthError(); as message) {
        <p id="register-dob-error" class="field-error">{{ message }}</p>
      }
    </div>

    <div class="field">
      <label for="register-channel">{{ 'register.verifyBy' | t }}</label>
      <select id="register-channel" formControlName="channel">
        <option value="Email">{{ 'common.email' | t }}</option>
        <option value="Sms">{{ 'register.sms' | t }}</option>
      </select>
    </div>

    <div class="field">
      <label for="register-destination">
        {{ form.value.channel === 'Sms' ? ('register.phone' | t) : ('register.emailAddress' | t) }}
      </label>
      <input id="register-destination" type="text" formControlName="destination" />
    </div>

    <button type="submit" class="primary" [disabled]="form.invalid || submitting()">{{ 'register.submit' | t }}</button>
  </form>

  <p class="link-row">
    <a routerLink="/login">{{ 'register.haveAccount' | t }}</a>
  </p>
  <p class="link-row">
    <a href="/privacy.html" target="_blank" rel="noopener">{{ 'common.privacy' | t }}</a>
  </p>
</div>
