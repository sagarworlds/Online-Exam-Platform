<div class="page">
  <h1>Register</h1>

  @if (errorMessage()) {
    <p class="error-message">{{ errorMessage() }}</p>
  }

  <form class="card" [formGroup]="form" (ngSubmit)="submit()">
    <div class="field">
      <label for="register-display-name">Display name</label>
      <input
        id="register-display-name"
        type="text"
        formControlName="displayName"
        autocomplete="name"
        [attr.aria-invalid]="displayNameError() ? 'true' : null"
        [attr.aria-describedby]="displayNameError() ? 'register-display-name-error' : null"
      />
      @if (displayNameError(); as message) {
        <p id="register-display-name-error" class="field-error">{{ message }}</p>
      }
    </div>

    <div class="field">
      <label for="register-dob">Date of birth</label>
      <input
        id="register-dob"
        type="date"
        formControlName="dateOfBirth"
        autocomplete="bday"
        [max]="maxDateOfBirth"
        [attr.aria-invalid]="dateOfBirthError() ? 'true' : null"
        [attr.aria-describedby]="dateOfBirthError() ? 'register-dob-error' : null"
      />
      @if (dateOfBirthError(); as message) {
        <p id="register-dob-error" class="field-error">{{ message }}</p>
      }
    </div>

    <div class="field">
      <label for="register-channel">Verify by</label>
      <select id="register-channel" formControlName="channel">
        <option value="Email">Email</option>
        <option value="Sms">SMS</option>
      </select>
    </div>

    <div class="field">
      <label for="register-destination">
        {{ form.value.channel === 'Sms' ? 'Phone number' : 'Email address' }}
      </label>
      <input id="register-destination" type="text" formControlName="destination" />
    </div>

    <button type="submit" class="primary" [disabled]="form.invalid || submitting()">Create account</button>
  </form>

  <p class="link-row">
    <a routerLink="/login">Already have an account? Log in</a>
  </p>
</div>
