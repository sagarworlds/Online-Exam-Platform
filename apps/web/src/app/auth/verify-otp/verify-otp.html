<div class="page">
  <h1>Verify code</h1>

  @if (maskedDestination) {
    <!-- Login copy never confirms the account exists: the API answers unknown,
         locked and staff accounts the same way and silently sends nothing. -->
    @if (isRegistration) {
      <p>We've sent a code to {{ maskedDestination }}.</p>
    } @else {
      <p>If an account exists for {{ maskedDestination }}, we've sent a code.</p>
    }
  }

  @if (errorMessage()) {
    <p class="error-message">{{ errorMessage() }}</p>
  }

  @if (challengeId) {
    <form class="card" [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label for="verify-otp-code">Code</label>
        <input
          id="verify-otp-code"
          type="text"
          inputmode="numeric"
          formControlName="code"
          autocomplete="one-time-code"
        />
      </div>
      <button type="submit" class="primary" [disabled]="form.invalid || submitting()">Verify</button>
    </form>
  }

  <p class="link-row">
    <a routerLink="/login">Back to login</a>
  </p>
</div>
