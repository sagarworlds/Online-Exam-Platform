<section class="report-issue" [attr.aria-label]="(scope() === 'question' ? 'attempt.report.questionStart' : 'attempt.report.region') | t">
  @if (sent()) {
    <p class="success-message" role="status">{{ 'attempt.report.sent' | t }}</p>
  }

  @if (open()) {
    <form
      class="card report-issue__form"
      (submit)="$event.preventDefault(); send()"
      [attr.aria-label]="(scope() === 'question' ? 'attempt.report.questionStart' : 'attempt.report.formLabel') | t"
    >
      @if (scope() === 'attempt') {
        <div class="field">
          <label [attr.for]="idPrefix() + '-category'">{{ 'attempt.report.category' | t }}</label>
          <select [id]="idPrefix() + '-category'" [value]="category()" (change)="category.set($any($event.target).value)" [disabled]="busy()">
            @for (option of attemptCategories; track option) {
              <option [value]="option" [selected]="option === category()">{{ categoryLabel(option) }}</option>
            }
          </select>
        </div>
      }
      <div class="field">
        <label [attr.for]="idPrefix() + '-message'">{{ (scope() === 'question' ? 'attempt.report.questionWhat' : 'attempt.report.what') | t }}</label>
        <textarea
          #messageBox
          [id]="idPrefix() + '-message'"
          rows="3"
          aria-required="true"
          [attr.aria-describedby]="idPrefix() + '-hint'"
          [maxLength]="maxMessage"
          [value]="message()"
          (input)="message.set($any($event.target).value)"
          [disabled]="busy()"
        ></textarea>
        <p class="hint" [id]="idPrefix() + '-hint'">{{ 'attempt.report.hint' | t: { max: maxMessage } }}</p>
      </div>
      @if (error()) {
        <p class="error-message" role="alert">{{ error() }}</p>
      }
      <div class="actions">
        <button type="submit" class="primary" [disabled]="busy() || message().trim() === ''">{{ 'attempt.report.send' | t }}</button>
        <button type="button" (click)="cancel()" [disabled]="busy()">{{ 'common.cancel' | t }}</button>
      </div>
    </form>
  } @else {
    <div class="report-issue__start">
      <button #openButton type="button" (click)="start()">{{ (scope() === 'question' ? 'attempt.report.questionStart' : 'attempt.report.start') | t }}</button>
    </div>
  }
</section>
