<div class="card">
  <h2>{{ 'exams.copying.title' | t }}</h2>
  @if (editable()) {
    <form (submit)="$event.preventDefault(); save()" [attr.aria-label]="'exams.copying.title' | t">
      <label class="inline-check">
        <input type="checkbox" [checked]="ticked()" (change)="toggle($any($event.target).checked)" />
        {{ 'exams.copying.turnOff' | t }}
      </label>
      <p class="hint">{{ 'exams.copying.hint' | t }}</p>
      @if (dirty()) {
        <div class="actions">
          <button type="submit" class="primary" [disabled]="busy()">{{ 'common.save' | t }}</button>
          <button type="button" (click)="discard()" [disabled]="busy()">{{ 'common.cancel' | t }}</button>
        </div>
      }
    </form>
  } @else {
    <p>{{ 'exams.copying.readLine' | t: { state: enabled() ? ('exams.copying.stateOn' | t) : ('exams.copying.stateAllowed' | t) } }}</p>
  }
</div>
