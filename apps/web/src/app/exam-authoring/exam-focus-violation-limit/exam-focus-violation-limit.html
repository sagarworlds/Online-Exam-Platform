<div class="card">
  <h2>{{ 'exams.leaving.title' | t }}</h2>
  @if (editable()) {
    <form (submit)="save($event)" [attr.aria-label]="'exams.leaving.title' | t">
      <label class="inline-check">
        <input type="checkbox" [checked]="watching()" (change)="toggle($any($event.target).checked)" />
        {{ 'exams.leaving.watch' | t }}
      </label>
      @if (watching()) {
        <div class="field">
          <label for="focus-violation-limit">{{ 'exams.leaving.field' | t }}</label>
          <input
            id="focus-violation-limit"
            type="number"
            inputmode="numeric"
            step="1"
            [attr.min]="fewest"
            [attr.max]="most"
            [value]="numberText()"
            (input)="typeNumber($any($event.target).value)"
            [attr.aria-invalid]="parsed() === null"
            aria-describedby="focus-violation-limit-hint"
          />
          <p id="focus-violation-limit-hint" class="hint">{{ 'exams.leaving.rangeHint' | t: { fewest: fewest, most: most } }}</p>
        </div>
      }
      <p class="hint">{{ 'exams.leaving.defaultHint' | t }}</p>
      @if (dirty()) {
        <div class="actions">
          <button type="submit" class="primary" [disabled]="busy() || parsed() === null">{{ 'common.save' | t }}</button>
          <button type="button" (click)="discard()" [disabled]="busy()">{{ 'common.cancel' | t }}</button>
        </div>
      }
    </form>
  } @else {
    <p>{{ 'exams.leaving.readLine' | t: { state: readState() } }}</p>
  }
</div>
