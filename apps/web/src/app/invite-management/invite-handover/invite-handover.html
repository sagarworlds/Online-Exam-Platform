<div class="handover" role="group" [attr.aria-label]="'Invite code for ' + email()">
  <div class="handover__row">
    <span class="handover__name">Invite code</span>
    <code class="handover__value handover__value--code">{{ code() }}</code>
    <button type="button" class="btn btn--small" (click)="copyCode()">Copy code</button>
  </div>

  @if (link(); as url) {
    <div class="handover__row">
      <span class="handover__name">Link</span>
      <code class="handover__value">{{ url }}</code>
      <button type="button" class="btn btn--small" (click)="copyLink()">Copy link</button>
    </div>
  }

  <p class="hint">
    It works once, and only for the account that holds {{ email() }}.
    @if (expiresAt()) {
      It expires {{ expiresAt() | date: 'medium' }}.
    }
  </p>

  <p class="handover__status" role="status">{{ message() }}</p>

  @if (dismissible()) {
    <button type="button" class="btn btn--small" (click)="dismissed.emit()">Hide</button>
  }
</div>
