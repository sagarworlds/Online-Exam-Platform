<nav class="admin-sidebar" [class.admin-sidebar--collapsed]="collapsed()" [attr.aria-label]="'admin.sidebar.areas' | t">
  <button
    type="button"
    class="admin-sidebar__toggle"
    (click)="toggle()"
    [attr.aria-expanded]="!collapsed()"
    [attr.aria-label]="(collapsed() ? 'admin.sidebar.expand' : 'admin.sidebar.collapse') | t"
  >
    <span aria-hidden="true">{{ collapsed() ? '»' : '«' }}</span>
  </button>

  @for (section of sections(); track section.path) {
    <a
      [routerLink]="section.path"
      routerLinkActive="active"
      class="admin-sidebar__link"
      [title]="section.label | t"
      [attr.aria-label]="section.label | t"
    >
      <app-admin-icon [name]="section.icon" class="admin-sidebar__icon" />
      <span class="admin-sidebar__label">{{ section.label | t }}</span>
    </a>
  }
</nav>
