<div class="api-activity__bar" [class.api-activity__bar--on]="activity.visible()" aria-hidden="true"></div>

<!-- What assistive technology hears. Always present, so changes are announced politely instead of interrupting. -->
<p class="api-activity__sr-only" role="status" aria-live="polite">
  @if (activity.slow()) {
    {{ slowMessage }}
  } @else if (activity.visible()) {
    Loading
  }
</p>

<!-- What everyone else sees after a long wait; the same words as above, so it is hidden from assistive technology. -->
<p class="api-activity__note" [class.api-activity__note--on]="activity.slow()" aria-hidden="true">{{ slowMessage }}</p>
