<dialog #dialog class="modal" [class.modal--side]="side()" [class.modal--bottom]="bottom()" [attr.aria-labelledby]="titleId" (cancel)="onCancel($event)" (close)="onClosed()">
  <div class="modal__panel">
    <header class="modal__header">
      <h2 class="modal__title" [id]="titleId">{{ heading() }}</h2>
      <button type="button" class="modal__close" [attr.aria-label]="'common.close' | t" (click)="requestClose()">
        <span aria-hidden="true">×</span>
      </button>
    </header>
    <div class="modal__body">
      <ng-content />
    </div>
    <div class="modal__footer">
      <ng-content select="[modalFooter]" />
    </div>
  </div>
  <app-toast-host [scope]="titleId" />
</dialog>
