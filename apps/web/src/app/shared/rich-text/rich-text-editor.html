<div class="rich-editor" [class.rich-editor--disabled]="disabled()">
  <div class="rich-editor__toolbar" role="toolbar" aria-label="Text formatting">
    @for (action of actions; track action.name) {
      <!-- mousedown is cancelled so pressing a button keeps the selection in the text instead of stealing focus. -->
      <button
        type="button"
        [attr.aria-pressed]="isActive(action)"
        [attr.aria-label]="accessibleName(action)"
        [title]="action.label"
        [disabled]="disabled()"
        (mousedown)="$event.preventDefault()"
        (click)="run(action)"
      >
        {{ action.glyph }}
      </button>
    }
    <button
      type="button"
      aria-label="Insert image"
      title="Insert image"
      [disabled]="disabled()"
      (mousedown)="$event.preventDefault()"
      (click)="picker.click()"
    >
      Image
    </button>
    <input #picker type="file" hidden [accept]="acceptedImageTypes" (change)="onImagePicked($event)" />
  </div>
  @if (imageError(); as message) {
    <p class="field-error rich-editor__error" role="alert">{{ message }}</p>
  }
  <div #host class="rich-editor__host"></div>
</div>
