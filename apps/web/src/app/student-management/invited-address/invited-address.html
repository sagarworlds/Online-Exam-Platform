<form [formGroup]="form" (ngSubmit)="submit()" novalidate [attr.aria-busy]="saving()" [attr.aria-label]="'students.address.form' | t: { email: email() }">
  <p class="field-hint invited-address__hint">
    {{ 'students.address.hint' | t }}
  </p>

  <div class="field">
    <label [for]="fieldId()">{{ 'students.address.new' | t }}</label>
    <input [id]="fieldId()" type="email" formControlName="email" autocomplete="off" />
    @if (form.controls.email.invalid && form.controls.email.touched) {
      <p class="field-error">{{ 'students.address.invalid' | t }}</p>
    }
  </div>

  @if (errorMessage()) {
    <p #errorNotice class="error-message" role="alert" tabindex="-1">{{ errorMessage() }}</p>
  }

  <button type="submit" class="primary" [disabled]="saving()">{{ (saving() ? 'students.address.changing' : 'students.address.change') | t }}</button>
</form>
